name: API Tests

on:
  push:
    branches:
      - main
      - mobile
  pull_request:
    branches:
      - main
      - mobile

jobs:
  api-tests:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 19
        uses: actions/setup-java@v4
        with:
          java-version: '19'
          distribution: 'temurin'
          cache: maven

      - name: Run API tests
        run: mvn test -Dtest=ZipCodeTest